name: hermes-control-room-observer
version: 1.1.0
description: Runtime-observed activity telemetry and semantic Control Room reports
provides_tools:
  - report_activity
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
